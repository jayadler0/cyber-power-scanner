<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyber Power QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;color:#142014;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:600px;margin:auto;padding:18px 14px 30px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
h1{margin:0;font-size:26px}
.sub{color:#667066;margin:6px 0 16px}
#reader{width:100%;min-height:300px;border:1px solid #ddd;border-radius:16px;overflow:hidden}
.status{margin-top:14px;padding:13px;border-radius:12px;background:#eef4ef;color:#334}
.success{background:#e8f5e9;color:#17652d}
.error{background:#ffebee;color:#a51f2a}
button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;cursor:pointer}
.primary{background:#1f6b3a;color:#fff;width:100%;margin-top:12px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin-top:10px}
.small{font-size:12px;color:#777;margin-top:14px;line-height:1.45}
#manual{margin-top:16px}
#debug{font-size:11px;color:#777;word-break:break-word;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Cyber Power</h1>
<div class="sub">Authorized Employee QR Scanner</div>

<div id="reader"></div>

<div id="status" class="status">
Starting camera… Point the camera at the QR code.
</div>

<button id="restart" class="primary" style="display:none">Scan Another</button>

<div id="manual">
  <b>Test manually</b>
  <input id="token" placeholder="Example: EMP-EL2EPJ7Q" autocomplete="off">
  <button class="primary" onclick="lookupManual()">Look Up Token</button>
</div>

<div class="small">
The QR must contain only an employee token such as
<b>EMP-EL2EPJ7Q</b>. It must not contain the Google Drive URL.
</div>

<div id="debug"></div>
</div>
</div>

<script>
const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzBfmOVbnLDbcihsDpLyq_UhO4vFGuUv6QmNXt0hAEkbIto198-0o74-i3GYJRq3ClHQw/exec";

let scanner = null;
let locked = false;

function status(text, type=""){
  const el=document.getElementById("status");
  el.textContent=text;
  el.className="status "+type;
}

function goToLookup(token){
  token=String(token||"").trim();
  if(!token){
    status("No token was detected.","error");
    return;
  }
  locked=true;
  status("QR detected: "+token+" — looking up employee…","success");
  document.getElementById("debug").textContent =
    "Token: "+token;
  window.location.href =
    APPS_SCRIPT_URL+"?token="+encodeURIComponent(token);
}

function onScanSuccess(decodedText, decodedResult){
  if(locked) return;
  goToLookup(decodedText);
}

function onScanFailure(errorMessage){
  // Normal: the scanner checks frames continuously.
}

async function startScanner(){
  try{
    if(typeof Html5Qrcode === "undefined"){
      throw new Error("QR scanner library did not load. Check your internet connection and reload.");
    }

    scanner = new Html5Qrcode("reader", {verbose:false});

    const config = {
      fps: 15,
      qrbox: function(viewfinderWidth, viewfinderHeight){
        const size=Math.floor(Math.min(viewfinderWidth, viewfinderHeight)*0.78);
        return {width:size,height:size};
      },
      aspectRatio: 1.0,
      disableFlip: false
    };

    await scanner.start(
      {facingMode:{exact:"environment"}},
      config,
      onScanSuccess,
      onScanFailure
    );

    status("Camera is ready. Center the QR code inside the scan area.");
  }catch(e1){
    try{
      if(scanner) await scanner.clear().catch(()=>{});
      scanner = new Html5Qrcode("reader", {verbose:false});

      const devices = await Html5Qrcode.getCameras();

      if(!devices || !devices.length){
        throw new Error("No camera was found.");
      }

      const back =
        devices.find(d => /back|rear|environment/i.test(d.label)) ||
        devices[devices.length-1];

      await scanner.start(
        back.id,
        {
          fps:15,
          qrbox:function(w,h){
            const size=Math.floor(Math.min(w,h)*0.78);
            return {width:size,height:size};
          },
          aspectRatio:1.0,
          disableFlip:false
        },
        onScanSuccess,
        onScanFailure
      );

      status("Camera is ready. Center the QR code inside the scan area.");
    }catch(e2){
      status("Camera started but the QR scanner could not initialize. Use the manual box below to test the Sheet lookup.","error");
      document.getElementById("debug").textContent =
        "Scanner error: "+(e2.message||e2);
    }
  }
}

async function lookupManual(){
  const token=document.getElementById("token").value.trim();
  goToLookup(token);
}

document.getElementById("restart").onclick=()=>{
  location.reload();
};

startScanner();
</script>
</body>
</html>
